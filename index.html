<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Payroll Portal — Mike Mike's Mobile Mechanics</title>
    <style>
      :root {
        --purple: #6a0dad;
        --purple-deep: #4a0878;
        --purple-bright: #8b2fc9;
        --purple-text: #6a0dad;
        --purple-soft: #f1e7fa;
        --black: #0b0b0b;
        --bg: #f4f2f7;
        --surface: #ffffff;
        --surface-2: #faf8fc;
        --ink: #17121f;
        --muted: #5d5468;
        --line: #e3dcf0;
        --good: #177245;
        --bad: #b3261e;
        --shadow: 0 10px 30px rgba(43, 8, 74, 0.12);
        --radius-card: 14px;
        --radius-btn: 9px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --purple-text: #cd9df7;
          --purple-soft: #2a1840;
          --bg: #0b0b0b;
          --surface: #171220;
          --surface-2: #1e1729;
          --ink: #f4f1f9;
          --muted: #ab9fc2;
          --line: #322747;
          --good: #4cc38a;
          --bad: #ff8a80;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        line-height: 1.45;
      }
      button, input, select { font: inherit; }
      a { color: var(--purple-text); }

      /* ---------- Brand wordmark ---------- */
      .wordmark { line-height: 1; color: #fff; }
      .wordmark .wm-name {
        font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase;
        font-size: 1.55rem;
      }
      .wordmark .wm-name .slash { color: var(--purple-bright); font-style: italic; }
      .wordmark .wm-sub {
        margin-top: 0.3rem; font-size: 0.72rem; font-weight: 700;
        letter-spacing: 0.42em; text-transform: uppercase; color: #d9c8f2;
      }
      .wordmark .wm-tag { margin-top: 0.35rem; font-size: 0.8rem; font-style: italic; color: #b9a8d4; }
      .wordmark.small .wm-name { font-size: 1.05rem; }
      .wordmark.small .wm-sub { font-size: 0.58rem; letter-spacing: 0.34em; margin-top: 0.2rem; }
      .wordmark.small .wm-tag { display: none; }

      /* ---------- Top bar (inside app) ---------- */
      .topbar {
        background: var(--black); color: #fff;
        border-bottom: 4px solid var(--purple);
        position: sticky; top: 0; z-index: 20;
      }
      .topbar-in {
        max-width: 1120px; margin: 0 auto; padding: 0.7rem 1rem;
        display: flex; align-items: center; gap: 1rem; justify-content: space-between;
      }
      .topbar .who { text-align: right; font-size: 0.85rem; color: #cfc4e4; }
      .topbar .who strong { display: block; color: #fff; font-size: 0.95rem; }
      .btn-ghost {
        background: transparent; color: #fff; border: 1px solid #6f5b96;
        padding: 0.45rem 0.85rem; border-radius: var(--radius-btn); cursor: pointer; font-weight: 600;
      }
      .btn-ghost:hover { border-color: var(--purple-bright); background: rgba(106, 13, 173, 0.35); }

      .wrap { max-width: 1120px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

      /* ---------- Login ---------- */
      .login-shell {
        min-height: 100dvh; display: flex; flex-direction: column;
        background:
          linear-gradient(115deg, transparent 62%, rgba(106, 13, 173, 0.28) 62.2%, rgba(106, 13, 173, 0.28) 70%, transparent 70.2%),
          var(--black);
      }
      .login-head { padding: 2.2rem 1.25rem 0.5rem; max-width: 1120px; width: 100%; margin: 0 auto; }
      .login-main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 1.5rem 1rem 3rem; }
      .login-card {
        background: var(--surface); color: var(--ink); width: 100%; max-width: 430px;
        border-radius: var(--radius-card); box-shadow: var(--shadow); padding: 1.5rem 1.4rem 1.3rem;
        border-top: 5px solid var(--purple);
      }
      .login-card h1 { font-size: 1.3rem; margin: 0 0 1rem; }
      .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1.15rem; }
      .role-tab {
        padding: 0.65rem 0.5rem; border-radius: var(--radius-btn); cursor: pointer;
        border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
        font-weight: 700; text-align: center;
      }
      .role-tab[aria-selected="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
      label.field { display: block; margin-bottom: 0.9rem; }
      label.field span { display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
      label.field input, label.field select {
        width: 100%; padding: 0.7rem 0.75rem; border: 1.5px solid var(--line);
        border-radius: var(--radius-btn); background: var(--surface); color: var(--ink);
      }
      label.field input:focus, label.field select:focus { outline: 2px solid var(--purple-bright); outline-offset: 1px; border-color: var(--purple); }
      .btn-primary {
        width: 100%; padding: 0.8rem 1rem; border: 0; border-radius: var(--radius-btn);
        background: var(--purple); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer;
      }
      .btn-primary:hover { background: var(--purple-deep); }
      .form-error {
        display: none; margin: 0 0 0.9rem; padding: 0.6rem 0.75rem; border-radius: 8px;
        background: rgba(179, 38, 30, 0.1); color: var(--bad); font-size: 0.9rem; font-weight: 600;
      }
      .form-error.show { display: block; }
      .login-foot { text-align: center; color: #8f81ab; font-size: 0.8rem; padding: 0 1rem 1.4rem; }

      /* ---------- Generic UI ---------- */
      .page-head { margin: 0.4rem 0 1.1rem; }
      .page-head h1 { font-size: 1.55rem; margin: 0 0 0.2rem; }
      .page-head p { margin: 0; color: var(--muted); }
      .sample-banner {
        border: 1.5px dashed var(--purple); background: var(--purple-soft);
        border-radius: 10px; padding: 0.7rem 0.95rem; font-size: 0.9rem; margin-bottom: 1.1rem;
      }
      .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1.3rem; }
      .stat {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
        padding: 0.95rem 1rem; box-shadow: 0 2px 8px rgba(20, 5, 40, 0.05);
      }
      .stat .k { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
      .stat .v { font-size: 1.45rem; font-weight: 800; margin-top: 0.2rem; font-variant-numeric: tabular-nums; }
      .stat .s { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }
      .stat.net .v { color: var(--purple-text); }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
        padding: 1.1rem 1.15rem; margin-bottom: 1.2rem; box-shadow: 0 2px 8px rgba(20, 5, 40, 0.05);
      }
      .card h2 { font-size: 1.08rem; margin: 0 0 0.8rem; }
      .card h2 .sub { font-weight: 500; color: var(--muted); font-size: 0.85rem; }

      /* ---------- Record rows (pay history / employees) ---------- */
      .rec-head, .rec-row {
        display: grid; gap: 0.6rem; align-items: center;
        padding: 0.65rem 0.4rem;
      }
      .rec-head { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); }
      .rec-row { border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
      .rec-row:last-child { border-bottom: 0; }
      .rec-row .num { text-align: right; }
      .rec-head .num { text-align: right; }
      .rec-row .lbl { display: none; }
      .cols-checks { grid-template-columns: 1.05fr 1.7fr 0.85fr 0.85fr 0.85fr 1.5fr; }
      .cols-emps { grid-template-columns: 1.8fr 0.6fr 0.9fr 0.9fr 0.9fr 0.7fr; }
      .cols-summary { grid-template-columns: 1.1fr 0.6fr 0.9fr 0.9fr 0.9fr; }
      .row-actions { display: flex; gap: 0.45rem; justify-content: flex-end; flex-wrap: wrap; }
      .btn-small {
        padding: 0.42rem 0.7rem; border-radius: 7px; border: 1.5px solid var(--purple);
        background: var(--purple); color: #fff; font-weight: 700; font-size: 0.83rem; cursor: pointer;
        display: inline-flex; align-items: center; gap: 0.35rem;
      }
      .btn-small.alt { background: transparent; color: var(--purple-text); }
      .btn-small:hover { background: var(--purple-deep); color: #fff; border-color: var(--purple-deep); }
      .btn-small svg { width: 14px; height: 14px; flex: none; }
      .totals-row { font-weight: 800; border-top: 2px solid var(--line); }
      .emp-name { font-weight: 700; }
      .emp-meta { font-size: 0.8rem; color: var(--muted); }
      .pill {
        display: inline-block; padding: 0.12rem 0.55rem; border-radius: 999px; font-size: 0.72rem;
        font-weight: 700; background: var(--purple-soft); color: var(--purple-text); vertical-align: middle;
      }
      .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 700; text-decoration: none; margin-bottom: 1rem; cursor: pointer; background: none; border: 0; color: var(--purple-text); padding: 0; font-size: 0.95rem; }
      .back-link:hover { text-decoration: underline; }

      /* ---------- Calculator ---------- */
      .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; }
      .calc-out { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 0.9rem; display: none; }
      .calc-out.show { display: block; }
      .calc-lines { display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1rem; max-width: 460px; font-variant-numeric: tabular-nums; }
      .calc-lines .grand { font-weight: 800; border-top: 2px solid var(--line); padding-top: 0.4rem; margin-top: 0.3rem; }
      .fineprint { font-size: 0.8rem; color: var(--muted); margin-top: 0.8rem; }

      /* ---------- Pay stub (modular: restyle .stub-* to match the owner's template) ---------- */
      .stub {
        background: #fff; color: #14101c; border: 1px solid #cfc6de; border-radius: 4px;
        max-width: 820px; margin: 0 auto; overflow: hidden;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .stub-band {
        background: #4a0878; color: #fff; padding: 1rem 1.3rem;
        display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
      }
      .stub-band .co { font-weight: 800; font-size: 1.3rem; letter-spacing: 0.01em; }
      .stub-band-r { text-align: right; flex: none; }
      .stub-band .doc-title { font-weight: 800; font-size: 1.15rem; letter-spacing: 0.1em; }
      .stub-band .doc-date { font-size: 0.88rem; color: #e2d4f7; margin-top: 0.2rem; }
      .stub-body { padding: 1rem 1.3rem 1.2rem; }
      .stub-sec {
        background: #e8e8eb; color: #26222e; font-weight: 800; font-size: 0.76rem;
        letter-spacing: 0.09em; text-transform: uppercase; padding: 0.42rem 0.6rem; margin-bottom: 0.55rem;
      }
      .stub-info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.6rem; margin-bottom: 1.05rem; }
      .stub-info .kv { display: flex; gap: 0.5rem; font-size: 0.92rem; padding: 0.14rem 0.1rem; }
      .stub-info .kv .k { font-weight: 700; color: #4c445c; min-width: 6.4rem; flex: none; }
      .stub-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.92rem; font-variant-numeric: tabular-nums; margin-bottom: 1.05rem; }
      .stub-table th { text-align: right; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: #6b617a; padding: 0.3rem 0.5rem; border-bottom: 1.5px solid #d9d2e6; }
      .stub-table th:first-child { text-align: left; }
      .stub-table td { text-align: right; padding: 0.36rem 0.5rem; border-bottom: 1px solid #eee9f6; }
      .stub-table td:first-child { text-align: left; }
      .stub-earn th:nth-child(1) { width: 32%; }
      .stub-earn th:nth-child(2) { width: 15%; }
      .stub-earn th:nth-child(3) { width: 13%; }
      .stub-earn th:nth-child(4) { width: 20%; }
      .stub-earn th:nth-child(5) { width: 20%; }
      .stub-tax th:nth-child(1) { width: 60%; }
      .stub-tax th:nth-child(2) { width: 20%; }
      .stub-tax th:nth-child(3) { width: 20%; }
      .stub-table tr.band-total td { background: #e7dbf7; font-weight: 800; border-bottom: 0; color: #2c1150; }
      .stub-netband {
        display: grid; grid-template-columns: 60% 20% 20%; align-items: center;
        background: #4a0878; color: #fff; padding: 0.65rem 0.5rem; margin-bottom: 1.05rem;
      }
      .stub-netband .nk { font-weight: 800; letter-spacing: 0.08em; font-size: 0.95rem; }
      .stub-netband .nv { font-weight: 800; text-align: right; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
      .stub-footboxes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.6rem; }
      .stub-box { border: 1px solid #e0d9ec; }
      .stub-box .stub-sec { margin-bottom: 0; }
      .stub-box p { margin: 0; padding: 0.55rem 0.6rem 0.65rem; font-size: 0.88rem; }
      .stub-actions { max-width: 820px; margin: 0 auto 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .stub-actions .btn-small { padding: 0.6rem 1rem; font-size: 0.92rem; }

      /* ---------- Responsive ---------- */
      @media (max-width: 760px) {
        .stat-grid { grid-template-columns: 1fr 1fr; }
        .calc-grid { grid-template-columns: 1fr 1fr; }
        .stub-info, .stub-footboxes { grid-template-columns: 1fr; }
        .stub-table { font-size: 0.76rem; }
        .stub-table th { font-size: 0.6rem; letter-spacing: 0.03em; padding: 0.3rem 0.35rem; }
        .stub-table td { padding: 0.36rem 0.35rem; }
        .stub-earn th:nth-child(1) { width: 26%; }
        .stub-earn th:nth-child(2) { width: 13%; }
        .stub-earn th:nth-child(3) { width: 13%; }
        .stub-earn th:nth-child(4) { width: 24%; }
        .stub-earn th:nth-child(5) { width: 24%; }
        .stub-tax th:nth-child(1) { width: 52%; }
        .stub-tax th:nth-child(2) { width: 24%; }
        .stub-tax th:nth-child(3) { width: 24%; }
        .stub-netband { grid-template-columns: 46% 27% 27%; padding: 0.6rem 0.35rem; }
        .stub-netband .nk { font-size: 0.85rem; }
        .stub-netband .nv { font-size: 0.92rem; }
        .rec-head { display: none; }
        .rec-row { grid-template-columns: 1fr 1fr; row-gap: 0.35rem; padding: 0.8rem 0.2rem; }
        .rec-row .lbl { display: block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
        .rec-row .num { text-align: left; }
        .rec-row .cell-wide { grid-column: 1 / -1; }
        .row-actions { grid-column: 1 / -1; justify-content: flex-start; }
        .topbar .who { display: none; }
        .stub-band { flex-direction: column; gap: 0.35rem; }
        .stub-band-r { text-align: left; }
        .stub-body { padding: 0.9rem 0.8rem 1rem; }
      }
      @media print {
        body { background: #fff; }
        .topbar, .stub-actions, .back-link, .no-print { display: none !important; }
        .wrap { padding: 0; max-width: none; }
        .stub { border: 0; border-radius: 0; max-width: none; }
      }
    </style>
  </head>

      /* ============ Stub PDF generator ============
         The stub is delivered as a real PDF, not an HTML file: iOS Safari
         degrades an HTML file handed to the share sheet into a plain-text
         scrap (it saved a .txt containing only the share title), while a

      var PDF_W = [278,278,355,556,556,889,667,180,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,222,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
      function pdfNum(n) { return Math.round(n * 100) / 100; }
      function pdfEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }
      function pdfTextW(s, size) {
        var w = 0;
        for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); w += (c >= 32 && c <= 126) ? PDF_W[c - 32] : 556; }
        return w * size / 1000;
      }
      function stubPDFBytes(emp, entry) {
        var chk = entry.check, calc = entry.calc, ytd = entry.ytd;
        var per = entry.period || periodFor(chk.payDate);
        var ytdEarn = entry.ytdEarnings || {};
        var ops = [];
        var PH = 792; /* page height, US Letter */
        function col(hex) { return pdfNum(parseInt(hex.slice(0, 2), 16) / 255) + " " + pdfNum(parseInt(hex.slice(2, 4), 16) / 255) + " " + pdfNum(parseInt(hex.slice(4, 6), 16) / 255); }
        function rect(x, yTop, w, h, hex) { ops.push(col(hex) + " rg " + pdfNum(x) + " " + pdfNum(PH - yTop - h) + " " + pdfNum(w) + " " + pdfNum(h) + " re f"); }

        function text(s, x, yBaseTop, size, bold, hex, align) {
          var w = pdfTextW(s, size), xx = x;
          if (align === "r") xx = x - w; else if (align === "c") xx = x - w / 2;
          ops.push("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + col(hex) + " rg " + pdfNum(xx) + " " + pdfNum(PH - yBaseTop) + " Td (" + pdfEsc(s) + ") Tj ET");

        var PURPLE = "4a0878", LAV = "e7dbf7", BAR = "e8e8eb", INK = "14101c", DEEP = "2c1150",
            LBL = "4c445c", HDR = "6b617a", LILAC = "e2d4f7", LINE = "d9d2e6", BORD = "cfc6de", BARTX = "26222e";

        var infoEnd = Math.max(
          infoCol(X0, "EMPLOYEE INFORMATION", [["Name:", emp.name], ["Employee ID:", emp.employeeId || emp.id], ["Pay Period:", fmtDateMDY(per.start) + " - " + fmtDateMDY(per.end)]], 122),
          infoCol(312, "PAYMENT INFORMATION", [["Method:", entry.method || emp.payMethod || ""], ["Check No.:", chk.checkNo || ""], ["Location:", entry.location || "Texas"]], 122));
        var y = infoEnd + 20;
        function sectionBar(title, yTop) { rect(X0, yTop, 516, 19, BAR); text(title, X0 + 8, yTop + 13.5, 8.5, true, BARTX); return yTop + 19; }
        function tableHead(cols, yTop) {

          rect(X0, yTop + 22, 516, 1.2, LINE);
          return yTop + 22;
        }
        /* Earnings */
        y = sectionBar("EARNINGS", y);
        y = tableHead([["", 0], ["RATE", 370], ["HOURS", 426], ["CURRENT", 494], ["YTD", 564]], y);
        var rowY = y + 18;
        calc.earnings.forEach(function (l) {
          text(l.desc, X0, rowY, 9.5, false, INK);
          text(l.rate == null ? "-" : (l.rateText || l.rate.toFixed(2)), 370, rowY, 9.5, false, INK, "r");
          text(l.hours == null ? "-" : l.hours.toFixed(2), 426, rowY, 9.5, false, INK, "r");
          text(money(l.amount), 494, rowY, 9.5, false, INK, "r");
          text(money(ytdEarn[l.desc] || 0), 564, rowY, 9.5, false, INK, "r");
          rowY += 18;
        });
        var grossTop = rowY - 10;
        rect(X0, grossTop, 516, 22, LAV);
        text("GROSS PAY", X0 + 8, grossTop + 15, 9.5, true, DEEP);
        text(money(calc.gross), 494, grossTop + 15, 9.5, true, DEEP, "r");
        text(money(ytd.gross), 564, grossTop + 15, 9.5, true, DEEP, "r");
        /* Employee taxes */
        y = sectionBar("EMPLOYEE TAXES", grossTop + 36);
        y = tableHead([["CURRENT", 494], ["YTD", 564]], y);
        rowY = y + 18;
        var ded = calc.deductions;
        [["Federal Income Tax", ded.federal, ytd.federal],
         ["Social Security Tax (6.2%)", ded.socialSecurity, ytd.socialSecurity],
         ["Medicare Tax (1.45%)", ded.medicare, ytd.medicare]].forEach(function (r) {
          text(r[0], X0, rowY, 9.5, false, INK);
          text(money(r[1]), 494, rowY, 9.5, false, INK, "r");
          text(money(r[2]), 564, rowY, 9.5, false, INK, "r");
          rowY += 18;
        });
        var dedTop = rowY - 10;
        rect(X0, dedTop, 516, 22, LAV);
        text("TOTAL DEDUCTIONS", X0 + 8, dedTop + 15, 9.5, true, DEEP);
        text(money(calc.totalDeductions), 494, dedTop + 15, 9.5, true, DEEP, "r");
        text(money(ytd.totalDeductions), 564, dedTop + 15, 9.5, true, DEEP, "r");
        /* Net pay band */
        var netTop = dedTop + 34;
        rect(X0, netTop, 516, 30, PURPLE);
        text("NET PAY", X0 + 8, netTop + 20, 12, true, "ffffff");
        text(money(calc.net), 494, netTop + 20, 11.5, true, "ffffff", "r");
        text(money(ytd.net), 564, netTop + 20, 11.5, true, "ffffff", "r");
        /* Footer boxes */
        var boxTop = netTop + 46, boxH = 56;
        function footBox(x, title, lines) {
          strokeRect(x, boxTop, 252, boxH, BORD);
          rect(x, boxTop, 252, 15, BAR);
          text(title, x + 8, boxTop + 11, 8, true, BARTX);
          lines.forEach(function (s, i) { text(s, x + 8, boxTop + 30 + i * 14, 8.6, false, INK); });
        }
        var hrs = function (n) { return (Number(n) || 0).toFixed(2); };
        footBox(X0, "W-4 INFORMATION", ["Filing Status: " + emp.filingStatus, "Total Dep. Amt: " + money(emp.depAmount || 0) + "  |  Add'l W/H: " + money(emp.addlWithholding || 0)]);
        footBox(312, "LEAVE BALANCES", ["Vacation: " + hrs(emp.vacationHours) + " hrs  |  Paid Time Off: " + hrs(emp.ptoHours) + " hrs"]);
        text("Generated from the Mike Mike's Mobile Mechanics Payroll Portal.", 306, boxTop + boxH + 26, 8, false, HDR, "c");
        /* Assemble the PDF document */
        var content = ops.join("\n");
        var objs = [
          "<< /Type /Catalog /Pages 2 0 R >>",
          "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
          "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
          "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
          "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
          "<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream"
        ];
        var pdf = "%PDF-1.4\n", offsets = [], i, j, o;
        for (i = 0; i < objs.length; i++) { offsets.push(pdf.length); pdf += (i + 1) + " 0 obj\n" + objs[i] + "\nendobj\n"; }
        var xref = pdf.length;
        pdf += "xref\n0 7\n0000000000 65535 f \n";
        for (j = 0; j < offsets.length; j++) { o = String(offsets[j]); while (o.length < 10) o = "0" + o; pdf += o + " 00000 n \n"; }
        pdf += "trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
        var bytes = new Uint8Array(pdf.length);

      /* ============ Save / share a stub file ============
         The stub travels as a PDF File — the one document type iOS passes
         through the share sheet intact. (An HTML file comes back as a .txt
         scrap holding only the share title, and a synthetic blob download
         is dropped or opened as a black screen in phone webviews.) Share
         data carries ONLY the file: no title/text item for iOS to save in
         its place. On phones the share sheet is the handoff (Save to
         Files / Mail / Messages); desktop browsers keep the plain blob
         download, and email falls back to a real mailto: anchor clicked
         inside the tap handler. */
      function isAppleMobile() {
        var ua = navigator.userAgent || "";
        return /iP(hone|ad|od)/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }
      function isMobileUA() {
        return isAppleMobile() || /Android/i.test(navigator.userAgent || "");
      }
      function stubFile(emp, entry) {
        try { return new File([stubPDFBytes(emp, entry)], stubFileName(emp, entry), { type: "application/pdf" }); }
        catch (e) { return null; }
      }
      function canShareFile(file) {
        return !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
      }
      function setStubStatus(msg) {
        var s = document.getElementById("stub-status");
        if (s) s.textContent = msg;
      }
      function saveStubViaDownload(emp, entry) {
        var blob = new Blob([stubPDFBytes(emp, entry)], { type: "application/pdf" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = stubFileName(emp, entry);
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        setStubStatus("Download started — look for “" + stubFileName(emp, entry) + "” in your downloads.");
      }
      function shareStubFile(emp, entry, statusMsg) {
        var file = stubFile(emp, entry);
        if (!canShareFile(file)) return false;
        navigator.share({ files: [file] }).then(function () {
          setStubStatus(statusMsg);
        }, function (err) {
          if (err && err.name === "AbortError") { setStubStatus(""); return; }
          saveStubViaDownload(emp, entry);
        });
        return true;
      }
      function openExternal(href) {
        /* A real anchor clicked inside the tap handler hands mailto:/sms:
           to the device; jumping the frame itself from an iframe does not. */
        var a = document.createElement("a");
        a.href = href;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
      function downloadStub(emp, entry) {
        if (isMobileUA() && shareStubFile(emp, entry,
              "Share sheet opened — choose Save to Files to keep the stub PDF on this device.")) return;
        saveStubViaDownload(emp, entry);
      }

      /* ============ Share a stub (email / text) ============ */
      function stubSummaryText(emp, entry) {
        var per = entry.period || periodFor(entry.check.payDate);
        return "Pay stub — " + emp.name + "\n" +
          "Mike Mike's Mobile Mechanics\n" +
          "Pay period: " + fmtDateMDY(per.start) + " – " + fmtDateMDY(per.end) + "\n" +
          "Pay date: " + fmtDateMDY(entry.check.payDate) + "\n" +
          "Gross pay: " + money(entry.calc.gross) + "\n" +
          "Total deductions: " + money(entry.calc.totalDeductions) + "\n" +
          "Net pay: " + money(entry.calc.net);
      }
      function shareStubEmail(emp, entry) {
        if (isMobileUA() && shareStubFile(emp, entry,
              "Share sheet opened — choose Mail and the stub PDF is attached for you.")) return;
        saveStubViaDownload(emp, entry); /* the stub PDF downloads so it can be attached before sending */
        var subject = "Pay Stub - " + fmtDateMDY(entry.check.payDate);
        var body = stubSummaryText(emp, entry) + "\n\nThe pay stub PDF was just downloaded to this device — please attach it to this email before sending.";
        openExternal("mailto:" + encodeURIComponent(emp.email || "") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body));
        setStubStatus("Your mail app should be opening with the stub summary filled in — attach the downloaded stub PDF before sending.");
      }
      function shareStubText(emp, entry) {
        if (shareStubFile(emp, entry,
              "Share sheet opened — choose Messages to text the stub PDF.")) return;
        var text = stubSummaryText(emp, entry);
        var num = "";
        if (session && session.role === "admin" && emp.phone) num = emp.phone.replace(/[^0-9+]/g, "");
        var sep = isAppleMobile() ? "&" : "?";
        openExternal("sms:" + num + sep + "body=" + encodeURIComponent(text));
      }

      /* ============ ADMIN ============ */
      function renderAdmin() {
        var ledgers = PAYROLL_DATA.employees.map(function (e) { return { emp: e, ledger: employeeLedger(e) }; });
        var tot = { gross: 0, ded: 0, net: 0, checks: 0, fed: 0 };
        ledgers.forEach(function (x) {
          if (!x.ledger.length) return;
          var y = x.ledger[x.ledger.length - 1].ytd;
          tot.gross += y.gross; tot.ded += y.totalDeductions; tot.net += y.net; tot.fed += y.federal; tot.checks += x.ledger.length;
        });
        var empRows = ledgers.map(function (x) {
          var y = x.ledger.length ? x.ledger[x.ledger.length - 1].ytd : { gross: 0, totalDeductions: 0, net: 0 };
          return '<div class="rec-row cols-emps">' +
            '<div><span class="emp-name">' + esc(x.emp.name) + "</span>" + (x.emp.sample ? ' <span class="pill">Sample</span>' : "") + '<div class="emp-meta">' + esc(x.emp.title) + " &middot; Employee ID " + esc(x.emp.employeeId || x.emp.id) + " &middot; PIN " + esc(x.emp.pin) + "</div></div>" +
            '<div class="num"><span class="lbl">Checks</span>' + x.ledger.length + "</div>" +
            '<div class="num"><span class="lbl">Gross YTD</span>' + money(y.gross) + "</div>" +
            '<div class="num"><span class="lbl">Deductions YTD</span>−' + money(y.totalDeductions) + "</div>" +
            '<div class="num"><span class="lbl">Net YTD</span><strong>' + money(y.net) + "</strong></div>" +
            '<div class="row-actions"><button class="btn-small alt" type="button" data-emp="' + esc(x.emp.id) + '">' + ICON_EYE + "Open</button></div>" +
          "</div>";
        }).join("");
        /* Payroll summary: one row per pay date across all employees */
        var byDate = {};
        ledgers.forEach(function (x) {
          x.ledger.forEach(function (entry) {
            var d = entry.check.payDate;
            if (!byDate[d]) byDate[d] = { count: 0, gross: 0, ded: 0, net: 0 };
            byDate[d].count++; byDate[d].gross += entry.calc.gross; byDate[d].ded += entry.calc.totalDeductions; byDate[d].net += entry.calc.net;
          });
        });
        var dates = Object.keys(byDate).sort().reverse();
        var sumRows = dates.map(function (d) {
          var s = byDate[d];
          return '<div class="rec-row cols-summary"><div><strong>' + fmtDate(d) + '</strong></div>' +
            '<div class="num"><span class="lbl">Checks</span>' + s.count + "</div>" +
            '<div class="num"><span class="lbl">Gross</span>' + money(round2(s.gross)) + "</div>" +
            '<div class="num"><span class="lbl">Deductions</span>−' + money(round2(s.ded)) + "</div>" +
            '<div class="num"><span class="lbl">Net</span><strong>' + money(round2(s.net)) + "</strong></div></div>";
        }).join("");

        app.innerHTML = topbar("Admin", "Administrator") +
          '<main class="wrap">' +
            '<div class="page-head"><h1>Payroll dashboard</h1><p>All employees, year-to-date totals, and every pay run for 2026.</p></div>' +
            (PAYROLL_DATA.employees.some(function (e) { return e.sample; }) ? sampleBanner("The portal is live with one sample employee so every login and stub can be tested. Send the previous payroll data and each employee's real record, PIN, and pay history will be loaded in its place.") : "") +
            '<div class="stat-grid">' +
              '<div class="stat"><div class="k">Employees</div><div class="v">' + PAYROLL_DATA.employees.length + '</div><div class="s">On the portal</div></div>' +
              '<div class="stat"><div class="k">Gross payroll YTD</div><div class="v">' + money(round2(tot.gross)) + '</div><div class="s">' + tot.checks + " checks issued</div></div>" +
              '<div class="stat"><div class="k">Taxes withheld YTD</div><div class="v">' + money(round2(tot.ded)) + '</div><div class="s">Federal ' + money(round2(tot.fed)) + " + FICA</div></div>" +
              '<div class="stat net"><div class="k">Net paid YTD</div><div class="v">' + money(round2(tot.net)) + '</div><div class="s">Take-home to employees</div></div>' +
            "</div>" +
            '<section class="card"><h2>Employees</h2>' +
              '<div class="rec-head cols-emps"><div>Employee</div><div class="num">Checks</div><div class="num">Gross YTD</div><div class="num">Deductions YTD</div><div class="num">Net YTD</div><div></div></div>' +
              empRows + "</section>" +
            '<section class="card"><h2>Payroll summary <span class="sub">— totals per pay date, all employees</span></h2>' +
              '<div class="rec-head cols-summary"><div>Pay date</div><div class="num">Checks</div><div class="num">Gross</div><div class="num">Deductions</div><div class="num">Net</div></div>' +
              sumRows + "</section>" +
            '<section class="card"><h2>Pay run calculator <span class="sub">— W-2 withholding estimate for one biweekly check</span></h2>' +
              '<div class="calc-grid">' +
                '<label class="field"><span>Hourly rate ($)</span><input id="calc-rate" type="number" min="0" step="0.25" value="28" /></label>' +
                '<label class="field"><span>Regular hours</span><input id="calc-reg" type="number" min="0" step="1" value="80" /></label>' +
                '<label class="field"><span>Overtime hours (1.5x)</span><input id="calc-ot" type="number" min="0" step="1" value="0" /></label>' +
                '<label class="field"><span>Bonus ($)</span><input id="calc-bonus" type="number" min="0" step="1" value="0" /></label>' +
              "</div>" +
              '<button class="btn-primary" style="width:auto;padding:0.65rem 1.4rem" type="button" id="btn-calc">Calculate check</button>' +
              '<div class="calc-out" id="calc-out"></div>' +
              '<p class="fineprint">Estimate only: federal withholding uses the IRS percentage method (Pub. 15-T, single filer, no other adjustments), Social Security is 6.2% up to the annual wage base, Medicare is 1.45% (+0.9% over $200,000 YTD). Texas has no state income tax. Confirm final figures against the current IRS tables or your tax professional before issuing pay.</p>' +
            "</section>" +
          "</main>";
        bindLogout();
        Array.prototype.forEach.call(app.querySelectorAll("[data-emp]"), function (b) {
          b.addEventListener("click", function () { renderAdminEmployee(b.getAttribute("data-emp")); window.scrollTo(0, 0); });
        });
        document.getElementById("btn-calc").addEventListener("click", function () {
          var rate = parseFloat(document.getElementById("calc-rate").value) || 0;
          var reg = parseFloat(document.getElementById("calc-reg").value) || 0;
          var ot = parseFloat(document.getElementById("calc-ot").value) || 0;
          var bonus = parseFloat(document.getElementById("calc-bonus").value) || 0;
          var previewEmp = { rate: rate };
          var c = computeCheck(previewEmp, { regHours: reg, otHours: ot, bonus: bonus }, 0);
          var out = document.getElementById("calc-out");
          out.innerHTML = '<div class="calc-lines">' +
            "<div>Gross pay</div><div>" + money(c.gross) + "</div>" +
            "<div>Federal income tax</div><div>−" + money(c.deductions.federal) + "</div>" +
            "<div>Social Security (6.2%)</div><div>−" + money(c.deductions.socialSecurity) + "</div>" +
            "<div>Medicare (1.45%)</div><div>−" + money(c.deductions.medicare) + "</div>" +
            '<div class="grand">Net pay</div><div class="grand">' + money(c.net) + "</div></div>";
          out.classList.add("show");
        });
      }

      /* ============ ADMIN: one employee ============ */
      function renderAdminEmployee(empId) {
        var emp = findEmployee(empId);
        var ledger = employeeLedger(emp);
        app.innerHTML = topbar("Admin", "Administrator") +
          '<main class="wrap">' +
            '<button class="back-link" id="btn-back" type="button">&larr; Back to dashboard</button>' +
            '<div class="page-head"><h1>' + esc(emp.name) + (emp.sample ? ' <span class="pill">Sample</span>' : "") + '</h1><p>' + esc(emp.title) + " &middot; Employee ID " + esc(emp.employeeId || emp.id) + " &middot; Hired " + fmtDate(emp.hireDate) + " &middot; " + esc(emp.payType) + " &middot; Filing: " + esc(emp.filingStatus) + " &middot; Employee PIN: " + esc(emp.pin) + "</p></div>" +
            ytdCards(ledger) +
            '<section class="card"><h2>All pay stubs — 2026</h2>' + checksRows(ledger, emp, "adminEmp") + "</section>" +
          "</main>";
        bindLogout();
        document.getElementById("btn-back").addEventListener("click", function () { renderAdmin(); window.scrollTo(0, 0); });
        bindStubButtons(ledger, emp, "adminEmp");
      }

      /* ============ Boot ============ */
      renderLogin();
</script>
</body>
</html>
